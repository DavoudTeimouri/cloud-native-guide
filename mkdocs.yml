site_name: Cloud-Native Guide
site_description: Step-by-step deployment and operations guide for on-premises, air-gapped, production-oriented cloud-native infrastructure.
site_url: https://davoudteimouri.github.io/cloud-native-guide/
repo_url: https://github.com/DavoudTeimouri/cloud-native-guide
repo_name: DavoudTeimouri/cloud-native-guide
edit_uri: blob/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - content.code.annotate
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.share
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.emoji

plugins:
  - search

nav:
  - Home: index.md
  - Journey 00-12:
      - 'Step 00 — Overview & architecture': en/cloud-native-stack-step-by-step.md
      - 'Step 01 — Offline artifact infrastructure': en/cloud-native-stack-step-by-step.md
