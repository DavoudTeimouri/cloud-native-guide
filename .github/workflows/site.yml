name: Site

# The MkDocs documentation site is generated from the repository. It is never
# edited by hand.
#
#   catalog/catalog.json            -> structured data for Repository 2
#   compatibility/version-matrix.md -> pinned versions (VERIFIED rows only)
#   scripts/build_site.py           -> structured data export (site/data.json)
#   docs/                           -> MkDocs source files
#   mkdocs.yml                      -> MkDocs configuration
#
# A stale site fails the build. The MkDocs build must succeed before deployment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site and structured data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs and dependencies
        run: |
          python3 -m pip install --quiet mkdocs mkdocs-material

      - name: Build MkDocs site
        run: mkdocs build --clean --strict

      - name: Generate structured data export for Repository 2
        run: python3 scripts/build_site.py

      - name: Repository self-check
        run: python3 tests/test_repo_tools.py

      - name: Catalog validation
        run: python3 scripts/validate_catalog.py

      - name: Documentation link check
        run: python3 scripts/check_links.py

      - name: Acceptance gate summary
        run: python3 scripts/acceptance_status.py

      - name: Upload the MkDocs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
