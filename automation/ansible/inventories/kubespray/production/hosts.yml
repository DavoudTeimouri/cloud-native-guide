# Production inventory - Example configuration for Kubespray deployment
# Copy and customize for your production environment
# REPLACE ALL EXAMPLE VALUES with actual infrastructure data

all:
  hosts:
    # Control Plane Nodes (3 for HA - production minimum)
    k8s-cp-1-prod:
      ansible_host: 10.20.0.11
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        node-role.kubernetes.io/control-plane: ""
        topology.kubernetes.io/zone: zone-a
        topology.kubernetes.io/region: primary
    k8s-cp-2-prod:
      ansible_host: 10.20.0.12
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        node-role.kubernetes.io/control-plane: ""
        topology.kubernetes.io/zone: zone-b
        topology.kubernetes.io/region: primary
    k8s-cp-3-prod:
      ansible_host: 10.20.0.13
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        node-role.kubernetes.io/control-plane: ""
        topology.kubernetes.io/zone: zone-c
        topology.kubernetes.io/region: primary

    # Worker Nodes (scale as needed)
    k8s-w-1-prod:
      ansible_host: 10.30.0.11
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        topology.kubernetes.io/zone: zone-a
        topology.kubernetes.io/region: primary
        workload-type: general
    k8s-w-2-prod:
      ansible_host: 10.30.0.12
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        topology.kubernetes.io/zone: zone-b
        topology.kubernetes.io/region: primary
        workload-type: general
    k8s-w-3-prod:
      ansible_host: 10.30.0.13
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        topology.kubernetes.io/zone: zone-c
        topology.kubernetes.io/region: primary
        workload-type: general
    k8s-w-4-prod:
      ansible_host: 10.30.0.14
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        topology.kubernetes.io/zone: zone-a
        topology.kubernetes.io/region: primary
        workload-type: general

    # GPU Workers (optional - requires GPU role implementation)
    # k8s-gpu-1-prod:
    #   ansible_host: 10.50.0.11
    #   ansible_user: ansible
    #   ansible_become: true
    #   kubespray_node_labels:
    #     nvidia.com/gpu.present: "true"
    #     topology.kubernetes.io/zone: zone-a
    #     workload-type: gpu

  children:
    # Control plane nodes (3 or 5 for HA)
    kube_control_plane:
      hosts:
        k8s-cp-1-prod:
        k8s-cp-2-prod:
        k8s-cp-3-prod:

    # All Kubernetes nodes (control plane + workers)
    kube_node:
      hosts:
        k8s-cp-1-prod:
        k8s-cp-2-prod:
        k8s-cp-3-prod:
        k8s-w-1-prod:
        k8s-w-2-prod:
        k8s-w-3-prod:
        k8s-w-4-prod:
        # k8s-gpu-1-prod:

    # Etcd nodes (stacked with control plane)
    etcd:
      hosts:
        k8s-cp-1-prod:
        k8s-cp-2-prod:
        k8s-cp-3-prod:

    # GPU workers (optional)
    # kube_gpu:
    #   hosts:
    #     k8s-gpu-1-prod: