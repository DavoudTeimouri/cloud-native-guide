# Staging inventory - Example configuration for Kubespray deployment
# Copy and customize for your staging environment
# REPLACE ALL EXAMPLE VALUES with actual infrastructure data

all:
  hosts:
    # Control Plane Nodes (3 for HA)
    k8s-cp-1-staging:
      ansible_host: 10.20.0.11
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        node-role.kubernetes.io/control-plane: ""
        topology.kubernetes.io/zone: zone-a
    k8s-cp-2-staging:
      ansible_host: 10.20.0.12
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        node-role.kubernetes.io/control-plane: ""
        topology.kubernetes.io/zone: zone-b
    k8s-cp-3-staging:
      ansible_host: 10.20.0.13
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        node-role.kubernetes.io/control-plane: ""
        topology.kubernetes.io/zone: zone-c

    # Worker Nodes
    k8s-w-1-staging:
      ansible_host: 10.30.0.11
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        topology.kubernetes.io/zone: zone-a
        workload-type: general
    k8s-w-2-staging:
      ansible_host: 10.30.0.12
      ansible_user: ansible
      ansible_become: true
      kubespray_node_labels:
        topology.kubernetes.io/zone: zone-b
        workload-type: general

    # GPU Workers (optional - requires GPU role implementation)
    # k8s-gpu-1-staging:
    #   ansible_host: 10.50.0.11
    #   ansible_user: ansible
    #   ansible_become: true
    #   kubespray_node_labels:
    #     nvidia.com/gpu.present: "true"
    #     workload-type: gpu

    # Storage Nodes (for Ceph/Rook - optional)
    # ceph-st-1-staging:
    #   ansible_host: 10.40.0.11
    #   ansible_user: ansible
    #   ansible_become: true

  children:
    # Control plane nodes (must be 3 or 5 for HA)
    kube_control_plane:
      hosts:
        k8s-cp-1-staging:
        k8s-cp-2-staging:
        k8s-cp-3-staging:

    # All Kubernetes nodes (control plane + workers)
    kube_node:
      hosts:
        k8s-cp-1-staging:
        k8s-cp-2-staging:
        k8s-cp-3-staging:
        k8s-w-1-staging:
        k8s-w-2-staging:
        # k8s-gpu-1-staging:

    # Etcd nodes (stacked with control plane)
    etcd:
      hosts:
        k8s-cp-1-staging:
        k8s-cp-2-staging:
        k8s-cp-3-staging:

    # GPU workers (optional)
    # kube_gpu:
    #   hosts:
    #     k8s-gpu-1-staging:

    # Storage nodes (optional)
    # kube_storage:
    #   hosts:
    #     ceph-st-1-staging: