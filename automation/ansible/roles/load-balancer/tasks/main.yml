---
- name: Install HAProxy and Keepalived packages
  ansible.builtin.package:
    name:
      - haproxy
      - keepalived
    state: present

- name: Configure HAProxy for Kubernetes API and ingress
  ansible.builtin.copy:
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      global
        log /dev/log local0
        maxconn 2000
        user haproxy
        group haproxy
        daemon

      defaults
        log global
        mode tcp
        retries 3
        timeout connect 5000
        timeout client 50000
        timeout server 50000

      frontend kubernetes-api
        bind *:6443
        default_backend kubernetes-api

      backend kubernetes-api
        balance roundrobin
        option tcp-check
        {% for host in groups['k8s_control_plane'] %}
        server {{ host }} {{ hostvars[host]['ansible_host'] }}:6443 check fall 3 rise 2
        {% endfor %}

      frontend k8s-ingress
        bind *:80
        bind *:443
        default_backend k8s-ingress

      backend k8s-ingress
        balance roundrobin
        option tcp-check
        {% for host in groups['k8s_nodes'] %}
        server {{ host }} {{ hostvars[host]['ansible_host'] }}:80 check fall 3 rise 2
        server {{ host }}-443 {{ hostvars[host]['ansible_host'] }}:443 check fall 3 rise 2
        {% endfor %}

- name: Configure Keepalived for virtual IP failover
  ansible.builtin.copy:
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      vrrp_instance VI_1 {
        state {{ keepalived_state }}
        interface {{ keepalived_interface }}
        virtual_router_id {{ keepalived_vrid }}
        priority {{ keepalived_priority }}
        advert_int 1
        virtual_ipaddress {
          {{ keepalived_vip }}
        }
        track_script {
          chk_haproxy
        }
      }

      vrrp_script chk_haproxy {
        script "killall -0 haproxy"
        interval 2
        weight 2
      }

- name: Ensure HAProxy and Keepalived services are running
  ansible.posix.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - haproxy
    - keepalived
