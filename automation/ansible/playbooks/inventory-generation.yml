- name: Generate Kubespray inventory from Ansible inventory
  hosts: localhost
  become: no
  vars_files:
    - group_vars/all/main.yml
    - group_vars/all/kubernetes.yml
  tasks:
    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ kubespray_inventory_dir }}"
        state: directory
        mode: "0755"

    - name: Generate hosts.yaml from Ansible groups
      ansible.builtin.template:
        src: templates/hosts.yaml.j2
        dest: "{{ kubespray_inventory_dir }}/hosts.yaml"
        mode: "0644"

    - name: Generate group_vars for Kubespray
      ansible.builtin.copy:
        content: |
          kube_version: {{ kubernetes_version }}
          kube_network_plugin: {{ kube_network_plugin }}
          kube_service_addresses: {{ kube_service_addresses }}
          kube_pods_subnet: {{ kube_pods_subnet }}
          etcd_deployment_type: {{ etcd_deployment_type }}
        dest: "{{ kubespray_inventory_dir }}/group_vars/k8s_cluster/k8s-cluster.yml"
        mode: "0644"
